
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <h1>Practica #3</h1>

    <nav>
        <h1>Menu de navegacion</h1>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <h1>Formulario de registro</h1>

    <form>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre">
        <br><br>

        <label for="direccion">Direccion</label>
        <input type="text" id="direccion" placeholder="Ingrese su direccion">
        <br><br>

        <label for="telefono">Telefono</label>
        <input type="tel" id="telefono" placeholder="Ingrese su teléfono">
        <br><br>

        <label for="fecha">Fecha de nacimiento</label>
        <input type="date" id="fecha">
        <br><br>

        <label for="ciudad">Ciudad</label>
        <input type="text" id="ciudad" placeholder="Ingrese su ciudad">
        <br><br>

        <label for="genero">Genero</label>
        <select id="genero">
            <option value="">Selecciona</option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
        </select>
        <br><br>

        <label for="pasatiempo">Pasatiempo</label>
        <input type="text" id="pasatiempo" placeholder="Ingrese su pasatiempo">
        <br><br>

        <label for="correo">Correo</label>
        <input type="email" id="correo" placeholder="Ingrese su correo">
        <br><br>

        <button type="submit">
            Iniciar sesion
        </button>

    </form>

</body>
</html>
